<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LeakGate: a firewall for AI agents. Approved destinations only, cleaned-up messages, and proof of what left." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LeakGate</title>
    <script>
      // Apply the saved (or system) theme before first paint: inline, no network, no flash.
      try {
        var t = localStorage.getItem("lg.theme");
        if (t !== "dark" && t !== "light") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
